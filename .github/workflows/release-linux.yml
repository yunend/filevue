name: Release linux

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build for linux
      run: npm run build-linux
      
    - name: Zip dist folder
      run: |
        cd dist/
        zip -r ../fileVue-linux-x64.zip *
        
    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        name: FileVue Linux Release
        tag: ${{ github.ref_name }}
        artifacts: fileVue-linux-x64.zip
        allowUpdates: true
        omitBody: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}