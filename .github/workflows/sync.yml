name: Sync to Gitee

on:
  push:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:  # 允许手动触发

jobs:
  sync-code:
    runs-on: ubuntu-latest
    # 代码推送和 Release 发布都触发代码同步
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，包含所有分支和标签

      - name: Push to Gitee
        run: |
          git remote add gitee https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ secrets.GITEE_OWNER }}/${{ secrets.GITEE_REPO }}.git
          git push gitee --all --force
          git push gitee --tags --force

  sync-release:
    runs-on: ubuntu-latest
    # 仅在 Release 发布时触发
    if: github.event_name == 'release'
    needs: sync-code  # 等代码同步完再处理 Release
    steps:
      - name: Sync Release to Gitee
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 自动提供，无需手动创建
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          # 安装 jq 用于解析 JSON
          sudo apt-get install -y jq

          # 获取当前 Release 信息
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          RELEASE_NAME="${{ github.event.release.name }}"
          RELEASE_BODY=$(echo "${{ github.event.release.body }}" | jq -Rs . | sed 's/^"//' | sed 's/"$//')

          echo "Syncing Release: ${RELEASE_TAG}"

          # 检查 Gitee 上是否已存在该标签的 Release
          EXISTING_RELEASE=$(curl -s -H "Content-Type: application/json" \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${RELEASE_TAG}" \
            -u "${GITEE_OWNER}:${GITEE_TOKEN}" || echo "")

          RELEASE_ID=$(echo "$EXISTING_RELEASE" | jq -r '.id // empty')

          if [ -z "$RELEASE_ID" ]; then
            # 不存在则创建新 Release
            echo "Creating new Release on Gitee..."
            CREATE_RESPONSE=$(curl -s -X POST \
              -H "Content-Type: application/json" \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
              -u "${GITEE_OWNER}:${GITEE_TOKEN}" \
              -d "{
                \"tag_name\": \"${RELEASE_TAG}\",
                \"name\": \"${RELEASE_NAME}\",
                \"body\": \"${RELEASE_BODY}\",
                \"target_commitish\": \"main\"
              }")
            RELEASE_ID=$(echo "$CREATE_RESPONSE" | jq -r '.id')
            echo "Created Release ID: ${RELEASE_ID}"
          else
            echo "Release already exists on Gitee, ID: ${RELEASE_ID}"
          fi

          # 下载并上传附件
          ASSETS_URL="${{ github.event.release.assets_url }}"
          ASSETS=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" "$ASSETS_URL")

          echo "$ASSETS" | jq -c '.[]' | while read -r asset; do
            ASSET_NAME=$(echo "$asset" | jq -r '.name')
            ASSET_DOWNLOAD_URL=$(echo "$asset" | jq -r '.url')
            
            echo "Downloading asset: ${ASSET_NAME}"
            curl -sL -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/octet-stream" \
              "${ASSET_DOWNLOAD_URL}" \
              -o "${ASSET_NAME}"

            echo "Uploading asset to Gitee: ${ASSET_NAME}"
            curl -s -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
              -u "${GITEE_OWNER}:${GITEE_TOKEN}" \
              -F "file=@${ASSET_NAME}"
          done

          echo "Release sync completed!"