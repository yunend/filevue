name: Release Multi-Platform

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build for Windows
      run: npm run build-win
      
    - name: Zip dist folder for Windows
      run: |
        Compress-Archive -Path "dist/*" -DestinationPath "fileVue-win-x64.zip" -Force
        
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: fileVue-win-x64
        path: fileVue-win-x64.zip
        retention-days: 1

  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build for Linux x64
      run: npm run build-linux
      
    - name: Zip dist folder for Linux x64
      run: |
        cd dist/
        zip -r ../fileVue-linux-x64.zip *
        
    - name: Upload Linux x64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: fileVue-linux-x64
        path: fileVue-linux-x64.zip
        retention-days: 1

  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-22.04-arm
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js for ARM64
      uses: actions/setup-node@v4
      with:
        node-version: '14'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build for Linux ARM64
      run: npm run build-linuxarm
      
    - name: Zip dist folder for Linux ARM64
      run: |
        cd dist/
        zip -r ../fileVue-linux-arm64.zip *
        
    - name: Upload Linux ARM64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: fileVue-linux-arm64
        path: fileVue-linux-arm64.zip
        retention-days: 1

  build-macos:
    name: Build macOS x64
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js for macOS
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build for macOS
      run: npm run build-mac
      
    - name: Create DMG for macOS (可选)
      run: |
        # macOS通常使用.app包或直接可执行文件
        cd dist/
        zip -r ../fileVue-macos-x64.zip *
        
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: fileVue-macos-x64
        path: fileVue-macos-x64.zip
        retention-days: 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux-x64, build-linux-arm64, build-macos]
    
    steps:
    - name: Checkout code with full history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整历史，包含所有分支和标签
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: fileVue-win-x64
        
    - name: Download Linux x64 artifact
      uses: actions/download-artifact@v4
      with:
        name: fileVue-linux-x64
        
    - name: Download Linux ARM64 artifact
      uses: actions/download-artifact@v4
      with:
        name: fileVue-linux-arm64
        
    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: fileVue-macos-x64
        
    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        name: FileVue ${{ github.ref_name }} Multi-Platform Release
        tag: ${{ github.ref_name }}
        artifacts: fileVue-win-x64.zip,fileVue-linux-x64.zip,fileVue-linux-arm64.zip,fileVue-macos-x64.zip
        allowUpdates: true
        omitBody: false
        body: |
          # FileVue ${{ github.ref_name }} 多平台发布
          
          ## 包含的构建
          - **Windows x64**: fileVue-win-x64.zip
          - **Linux x64**: fileVue-linux-x64.zip
          - **Linux ARM64**: fileVue-linux-arm64.zip
          - **macOS x64**: fileVue-macos-x64.zip
          
          ## 使用说明
          1. 下载对应平台的压缩包
          2. 解压后运行可执行文件
          3. 默认端口：8001
          
          ### macOS使用说明
          - 解压后，右键点击可执行文件
          - 选择"打开"
          - 如果系统提示"无法打开"，请在"系统偏好设置" → "安全性与隐私"中允许运行
          
          ### ARM64设备支持
          - Raspberry Pi 4/5
          - Apple Silicon Mac (通过Linux虚拟机)
          - ARM64服务器
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


    - name: Sync code to Gitee
      run: |
        git remote add gitee https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ secrets.GITEE_OWNER }}/${{ secrets.GITEE_REPO }}.git
        git push gitee --all --force
        git push gitee --tags --force

        - name: Sync Release to Gitee
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
        GITEE_REPO: ${{ secrets.GITEE_REPO }}
      run: |
        # 安装 jq 用于解析 JSON
        sudo apt-get install -y jq

        # 获取当前 Release 信息
        RELEASE_TAG="${{ github.ref_name }}"
        RELEASE_NAME="FileVue ${{ github.ref_name }} Multi-Platform Release"
        RELEASE_BODY="# FileVue ${{ github.ref_name }} 多平台发布

        ## 包含的构建
        - **Windows x64**: fileVue-win-x64.zip
        - **Linux x64**: fileVue-linux-x64.zip
        - **Linux ARM64**: fileVue-linux-arm64.zip
        - **macOS x64**: fileVue-macos-x64.zip

        ## 使用说明
        1. 下载对应平台的压缩包
        2. 解压后运行可执行文件
        3. 默认端口：8001

        ### macOS使用说明
        - 解压后，右键点击可执行文件
        - 选择"打开"
        - 如果系统提示"无法打开"，请在"系统偏好设置" → "安全性与隐私"中允许运行

        ### ARM64设备支持
        - Raspberry Pi 4/5
        - Apple Silicon Mac (通过Linux虚拟机)
        - ARM64服务器"

        echo "Syncing Release: ${RELEASE_TAG}"

        # 检查 Gitee 上是否已存在该标签的 Release
        EXISTING_RELEASE=$(curl -s -H "Content-Type: application/json" \
          "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${RELEASE_TAG}" \
          -u "${GITEE_OWNER}:${GITEE_TOKEN}" || echo "")

        RELEASE_ID=$(echo "$EXISTING_RELEASE" | jq -r '.id // empty')

        if [ -z "$RELEASE_ID" ]; then
          # 不存在则创建新 Release
          echo "Creating new Release on Gitee..."
          CREATE_RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
            -u "${GITEE_OWNER}:${GITEE_TOKEN}" \
            -d "{
              \"tag_name\": \"${RELEASE_TAG}\",
              \"name\": \"${RELEASE_NAME}\",
              \"body\": \"${RELEASE_BODY}\",
              \"target_commitish\": \"main\"
            }")
          RELEASE_ID=$(echo "$CREATE_RESPONSE" | jq -r '.id')
          echo "Created Release ID: ${RELEASE_ID}"
        else
          echo "Release already exists on Gitee, ID: ${RELEASE_ID}"
        fi

        # 下载并上传附件
        ASSETS_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}"
        ASSETS=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" "$ASSETS_URL")

        echo "$ASSETS" | jq -c '.assets[]' | while read -r asset; 
        do
          ASSET_NAME=$(echo "$asset" | jq -r '.name')
          ASSET_DOWNLOAD_URL=$(echo "$asset" | jq -r '.browser_download_url')
          
          echo "Downloading asset: ${ASSET_NAME}"
          curl -L -H "Authorization: token ${GITHUB_TOKEN}" \
            "${ASSET_DOWNLOAD_URL}" \
            -o "${ASSET_NAME}"
          
          # 显示文件大小
          FILE_SIZE=$(ls -lh "${ASSET_NAME}" | awk '{print $5}')
          echo "File size: ${FILE_SIZE}"

          # 上传到 Gitee，带重试机制
          MAX_RETRIES=5
          RETRY_COUNT=0
          UPLOAD_SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$UPLOAD_SUCCESS" = false ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Uploading asset to Gitee (attempt ${RETRY_COUNT}/${MAX_RETRIES}): ${ASSET_NAME}"
            
            # 计算超时时间：基础时间 + 重试次数 * 2分钟
            TIMEOUT=$((600 + RETRY_COUNT * 120))
            
            # 使用临时文件存储响应，避免变量捕获问题
            UPLOAD_RESPONSE_FILE="upload_response_${RETRY_COUNT}.json"
            
            curl -X POST \
              --max-time ${TIMEOUT} \
              --connect-timeout 60 \
              --keep-alive \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
              -u "${GITEE_OWNER}:${GITEE_TOKEN}" \
              -F "file=@${ASSET_NAME}" \
              -o "${UPLOAD_RESPONSE_FILE}" \
              -w "\nHTTP_CODE:%{http_code}\n"
            
            UPLOAD_EXIT_CODE=$?
            
            if [ $UPLOAD_EXIT_CODE -eq 0 ]; then
              # 检查HTTP状态码
              HTTP_CODE=$(grep "HTTP_CODE:" "${UPLOAD_RESPONSE_FILE}" | cut -d: -f2)
              
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
                echo "Upload successful! HTTP code: ${HTTP_CODE}"
                UPLOAD_SUCCESS=true
              else
                echo "Upload failed with HTTP code: ${HTTP_CODE}"
                echo "Response: $(cat ${UPLOAD_RESPONSE_FILE})"
              fi
            else
              echo "Upload failed with exit code: ${UPLOAD_EXIT_CODE}"
              echo "Response: $(cat ${UPLOAD_RESPONSE_FILE})"
              
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                WAIT_TIME=$((RETRY_COUNT * 15))
                echo "Waiting ${WAIT_TIME} seconds before retry..."
                sleep $WAIT_TIME
              fi
            fi
            
            # 清理临时文件
            rm -f "${UPLOAD_RESPONSE_FILE}"
          done

          if [ "$UPLOAD_SUCCESS" = false ]; then
            echo "Failed to upload ${ASSET_NAME} after ${MAX_RETRIES} attempts"
            exit 1
          fi
        done

        echo "Release sync completed!"      