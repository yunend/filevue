name: Release Multi-Platform

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build for Windows
      run: npm run build-win
      
    - name: Zip dist folder for Windows
      run: |
        Compress-Archive -Path "dist/*" -DestinationPath "fileVue-win-x64.zip" -Force
        
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: fileVue-win-x64
        path: fileVue-win-x64.zip
        retention-days: 1

  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build for Linux
      run: npm run build-linux
      
    - name: Zip dist folder for Linux
      run: |
        cd dist/
        zip -r ../fileVue-linux-x64.zip *
        
    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: fileVue-linux-x64
        path: fileVue-linux-x64.zip
        retention-days: 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: fileVue-win-x64
        
    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: fileVue-linux-x64
        
    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        name: FileVue ${{ github.ref_name }} Multi-Platform Release
        tag: ${{ github.ref_name }}
        artifacts: fileVue-win-x64.zip,fileVue-linux-x64.zip
        allowUpdates: true
        omitBody: false
        body: |
          # FileVue ${{ github.ref_name }} 多平台发布
          
          ## 包含的构建
          - **Windows x64**: fileVue-win-x64.zip
          - **Linux x64**: fileVue-linux-x64.zip
          
          ## 使用说明
          1. 下载对应平台的压缩包
          2. 解压后运行可执行文件
          3. 默认端口：8001
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}