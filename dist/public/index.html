<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件视界</title>
    <link rel="icon" href="./images/logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="./css/bootstrap4.min.css">
    <link rel="stylesheet" href="./css/filevue.css">
    <link rel="stylesheet" href="./css/common.css">
    <style>
        #fileVueStatus {
            border: 1px solid rgba(13, 110, 253, 0.15);
            background: linear-gradient(135deg, rgba(235, 248, 255, 0.95), rgba(240, 255, 245, 0.95));
            color: #0f4c75;
            border-radius: 0.85rem;
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.06);
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            font-size: 0.98rem;
            line-height: 1.6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        #fileVueStatus strong {
            color: #102a43;
        }
        #fileVueStatus .status-left,
        #fileVueStatus .status-right {
            display: inline-flex;
            align-items: center;
        }
        #fileVueStatus .status-right {
            justify-content: flex-end;
        }
    </style>
   
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">
            <img src="./images/logo.svg" width="40" height="40" alt="文件视界">
            <span style="margin-left: 10px;">文件视界</span>
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">首页</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./upload.html">上传文件</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./ggb/GeoGebra/HTML5/5.0/GeoGebra.html" target="_blank">GGB编辑</a>
                </li>
            </ul>
            <!-- 添加“关于”按钮 -->
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#" data-toggle="modal" data-target="#aboutModal">关于</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 添加“关于”模态框 -->
    <div class="modal fade" id="aboutModal" tabindex="-1" role="dialog" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="aboutModalLabel">关于</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p>FileVue版本：2.9.13</p>
                    <p>© 2025 303218145@qq.com</p>
                    
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 主体内容 -->
    <div class="container main-content mt-4">
        <div class="row">
            <!-- 左侧导航栏 -->
            <div class="col-md-3">
                <div class="list-group">
                    <button type="button" class="list-group-item list-group-item-action" 
                            onclick="fileVue.loadDirectory('/课件')">
                        课件
                    </button>
                    <button type="button" class="list-group-item list-group-item-action" 
                            onclick="fileVue.loadDirectory('/ggb/ggbResources')">
                        GGB文件
                    </button>
                    <button type="button" class="list-group-item list-group-item-action" 
                            onclick="fileVue.loadDirectory('/资源')">
                        资源
                    </button>
                    <button type="button" class="list-group-item list-group-item-action" 
                            onclick="fileVue.loadDirectory('/视频')">
                        视频
                    </button>
                    <button type="button" class="list-group-item list-group-item-action" 
                            onclick="fileVue.loadDirectory('/文档')">
                        文档
                    </button>
                </div>
            </div>
            <!-- 右侧文件列表 -->
            <div class="col-md-9">
                 <div id="fileVueStatus" role="status">
                     正在加载文件视图状态...
                 </div>
                 <div id="fileListContainer"></div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer>
        <div class="container">
            <span class="text-muted">© 2025 303218145@qq.com</span>
        </div>
    </footer>

    <script src="./js/jquery.min.js"></script>
    <script src="./js/bootstrap4.min.js"></script>
    <script src="./js/filevue.js"></script>
    <script>
        $(function() {
            function updateFileVueStatus(uploadEnabled) {
                const rootText = typeof root !== 'undefined' ? root : '未知';
                const uploadText = uploadEnabled === true
                    ? '已启用'
                    : '已禁用';     
                $('#fileVueStatus').html(
                    `<span class="status-left">文件上传：${uploadText}</span><span class="status-right">服务器：${rootText}</span>`
                );
            }

            $('.list-group').on('click', '.list-group-item', function() {
                $('.list-group .active').removeClass('active');
                $(this).addClass('active');
            });

            $.ajax({
                url: '/api/upload-status',
                method: 'GET',
                dataType: 'json',
                success: function(data) {
                    updateFileVueStatus(data.enabled);
                },
                error: function() {
                    updateFileVueStatus(undefined);
                }
            });
        });
    </script>
</body>
</html>
