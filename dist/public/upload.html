    <!-- 主体内容 -->
    <div class="container">
        <div class="upload-container">
            <h2 class="text-center mb-4">多文件上传</h2>
            <form id="uploadForm">
                <div class="form-group">
                    <input type="file" class="form-control-file" id="fileInput" required multiple>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="uploadBtn">上传文件</button>
            </form>
            <div class="mt-3 text-primary">每个文件不能大于1G</div>
            
            <!-- 进度条容器 -->
            <div id="progressContainer" class="progress-container">
                <h5 class="mb-3">上传进度</h5>
                <div id="currentFileInfo" class="file-info"></div>
                <div id="uploadStatus" class="upload-status"></div>
                <!-- 取消上传按钮 -->
                <div class="text-center mt-3">
                    <button id="cancelBtn" class="btn btn-danger btn-sm" style="display: none;">
                        <i class="fas fa-times-circle"></i> 取消上传
                    </button>
                </div>
            </div>
            
            <div id="message" class="mt-1 text-center"></div>
        </div>
    </div>


    <!-- 页脚 -->
    <footer>
        <div class="container">
            <span class="text-muted">© 2025 303218145@qq.com</span>
        </div>
    </footer>

    <script src="./js/jquery.min.js"></script>
    <script src="./js/bootstrap4.min.js"></script>
    <script>
        class UploadManager {
            constructor() {
                this.totalFiles = 0;
                this.uploadedFiles = 0;
                this.totalSize = 0;
                this.uploadedSize = 0;
                this.currentFile = null;
            }

            // 检查上传功能是否启用
            async checkUploadEnabled() {
                try {
                    const response = await fetch('/api/upload-status');
                    const data = await response.json();
                    return data.enabled;
                } catch (error) {
                    console.error('检查上传状态失败:', error);
                    return false; // 如果无法检查，默认认为不可用
                }
            }

            // 格式化文件大小
            formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            // 更新当前文件信息
            updateCurrentFileInfo(file, progress) {
                const fileInfo = document.getElementById('currentFileInfo');
                const progressPercent = Math.round(progress * 100);
                fileInfo.innerHTML = `
                    <strong>当前文件:</strong> ${file.name} 
                    <span class="text-muted">(${this.formatFileSize(file.size)})</span>
                    <span class="float-right">${progressPercent}%</span>
                `;
            }

            // 更新上传状态
            updateUploadStatus(message, type = 'info') {
                const statusDiv = document.getElementById('uploadStatus');
                statusDiv.innerHTML = `<span class="upload-${type}">${message}</span>`;
            }

            // 开始上传
            async startUpload(files) {
                // 首先检查上传功能是否被启用
                const uploadEnabled = await this.checkUploadEnabled();
                if (!uploadEnabled) {
                    document.getElementById('message').textContent = '文件上传功能已被禁用';
                    document.getElementById('uploadBtn').disabled = false;
                    return;
                }

                this.totalFiles = files.length;
                this.uploadedFiles = 0;
                this.totalSize = 0;
                this.uploadedSize = 0;
                this.currentXHR = null;

                // 计算总大小
                for (let file of files) {
                    this.totalSize += file.size;
                }

                // 显示进度容器
                const progressContainer = document.getElementById('progressContainer');
                progressContainer.style.display = 'block';

                // 禁用上传按钮，显示取消按钮
                document.getElementById('uploadBtn').disabled = true;
                document.getElementById('cancelBtn').style.display = 'inline-block';

                this.updateUploadStatus(`准备上传 ${this.totalFiles} 个文件，总大小: ${this.formatFileSize(this.totalSize)}`, 'info');

                // 逐个上传文件
                this.uploadFilesSequentially(files);
            }

            // 顺序上传文件
            async uploadFilesSequentially(files) {
                for (let i = 0; i < files.length; i++) {
                    
                    this.currentFile = files[i];
                    await this.uploadSingleFile(this.currentFile);
                    this.uploadedFiles++;
                }

                this.finishUpload();
            }

            // 上传单个文件
            uploadSingleFile(file) {
                return new Promise((resolve, reject) => {

                    

                    const formData = new FormData();
                    formData.append('files', file);

                    const xhr = new XMLHttpRequest();
                    this.currentXHR = xhr;

                    // 监听上传进度
                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const progress = e.loaded / e.total;
                            this.updateCurrentFileInfo(file, progress);
                        }
                    });

                    // 监听完成
                    xhr.addEventListener('load', () => {
                        if (xhr.status === 200) {
                            this.uploadedSize += file.size;
                            this.updateUploadStatus(`文件 "${file.name}" 上传成功`, 'success');
                            resolve();
                        } else {
                            this.updateUploadStatus(`文件 "${file.name}" 上传失败: ${xhr.statusText}`, 'error');
                            reject(new Error(`上传失败: ${xhr.statusText}`));
                        }
                    });

                    // 监听错误
                    xhr.addEventListener('error', () => {
                        this.updateUploadStatus(`文件 "${file.name}" 上传出错`, 'error');
                        reject(new Error('网络错误'));
                    });

                    // 监听中止
                    xhr.addEventListener('abort', () => {
                        reject(new Error('上传已取消'));
                    });

                    xhr.open('POST', '/upload');
                    xhr.send(formData);
                });
            }

            // 完成上传
            finishUpload() {
                
                // 启用上传按钮，隐藏取消按钮
                document.getElementById('uploadBtn').disabled = false;
                document.getElementById('cancelBtn').style.display = 'none';

                if (this.uploadedFiles === this.totalFiles) {
                    this.updateUploadStatus(`所有文件上传完成！共上传 ${this.uploadedFiles} 个文件，总大小: ${this.formatFileSize(this.uploadedSize)}`, 'success');
                    
                    // 清空文件输入
                    document.getElementById('fileInput').value = '';
                    
                    // 5秒后隐藏进度容器
                    setTimeout(() => {
                        document.getElementById('progressContainer').style.display = 'none';
                    }, 5000);
                } else {
                    this.updateUploadStatus(`上传完成，共成功上传 ${this.uploadedFiles}/${this.totalFiles} 个文件`, 'warning');
                }
            }

            // 取消上传
            cancelUpload() {
                 // 中止当前正在进行的XMLHttpRequest
                if (this.currentXHR) {
                    this.currentXHR.abort();
                    this.currentXHR = null;
                }
                this.updateUploadStatus('上传已取消', 'warning');
                // 启用上传按钮，隐藏取消按钮
                document.getElementById('uploadBtn').disabled = false;
                document.getElementById('cancelBtn').style.display = 'none';
            }
        }

        // 初始化上传管理器
        const uploadManager = new UploadManager();

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const files = document.getElementById('fileInput').files;
            if (files.length === 0) {
                document.getElementById('message').textContent = '请选择要上传的文件';
                return;
            }

            // 检查文件大小限制
            for (let file of files) {
                if (file.size > 1024 * 1024 * 1024) { // 1GB
                    document.getElementById('message').textContent = `文件 "${file.name}" 超过1GB大小限制`;
                    return;
                }
            }

            document.getElementById('message').textContent = '';
            await uploadManager.startUpload(files);
        });

        // 取消上传按钮事件监听
        document.getElementById('cancelBtn').addEventListener('click', function() {
            if (confirm('确定要取消上传吗？')) {
                    uploadManager.cancelUpload();
                }
        });

        // 取消上传功能- ESC键
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (confirm('确定要取消上传吗？')) {
                    uploadManager.cancelUpload();
                }
            }
        });
    </script>
</body>
