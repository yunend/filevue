    <!-- 主体内容 -->
    <div class="container">
        <div class="upload-container">
            <h2 class="text-center mb-4">上传文件夹</h2>
            <form id="uploadForm">
                <div class="folder-input-container" id="folderInputContainer">
                    <div class="folder-icon">📁</div>
                    <h5>点击选择文件夹或拖拽文件夹到此处</h5>
                    <p class="text-muted">支持上传整个文件夹及其子目录</p>
                    <input type="file" class="form-control-file" id="folderInput" webkitdirectory multiple style="display: none;">
                </div>
                
                <div id="selectedFolderInfo" class="selected-folder-info" style="display: none;">
                    <h6>已选择文件夹:</h6>
                    <div id="folderPath"></div>
                    <div id="folderStats" class="folder-stats"></div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" id="uploadBtn" disabled>上传文件夹</button>
            </form>
            <div class="mt-3 text-danger">每个文件不能大于1G，文件夹总大小无限制</div>
            
            <div id="uploadStatus" class="upload-status"></div>
            <div id="message" class="mt-1 text-center"></div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer>
        <div class="container">
            <span class="text-muted">© 2025 303218145@qq.com</span>
        </div>
    </footer>

    <script src="/js/jquery.min.js"></script>
    <script src="/js/bootstrap4.min.js"></script>
    <script>
        class FolderUploadManager {
            constructor() {
                this.totalFiles = 0;
                this.uploadedFiles = 0;
                this.totalSize = 0;
                this.uploadedSize = 0;
                this.folderName = '';
                this.files = [];
            }

            // 格式化文件大小
            formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            // 更新上传状态
            updateUploadStatus(message, type = 'info') {
                const statusDiv = document.getElementById('uploadStatus');
                statusDiv.innerHTML = `<span class="upload-${type}">${message}</span>`;
            }

            // 分析文件夹内容
            analyzeFolder(files) {
                this.files = Array.from(files);
                this.totalFiles = files.length;
                this.totalSize = 0;
                
                // 获取文件夹名称（从第一个文件的相对路径）
                if (files.length > 0) {
                    const firstFile = files[0];
                    const webkitRelativePath = firstFile.webkitRelativePath;
                    if (webkitRelativePath) {
                        this.folderName = webkitRelativePath.split('/')[0];
                    }
                }
                
                // 计算总大小
                for (let file of files) {
                    this.totalSize += file.size;
                }
                
                // 显示文件夹信息
                this.displayFolderInfo();
            }

            // 显示文件夹信息
            displayFolderInfo() {
                const folderInfoDiv = document.getElementById('selectedFolderInfo');
                const folderPathDiv = document.getElementById('folderPath');
                const folderStatsDiv = document.getElementById('folderStats');
                
                folderPathDiv.textContent = this.folderName || '未命名文件夹';
                folderStatsDiv.innerHTML = `
                    包含 ${this.totalFiles} 个文件，总大小: ${this.formatFileSize(this.totalSize)}
                `;
                
                folderInfoDiv.style.display = 'block';
                document.getElementById('uploadBtn').disabled = false;
            }

            // 开始上传
            startUpload() {
                this.uploadedFiles = 0;
                this.uploadedSize = 0;
                
                document.getElementById('uploadBtn').disabled = true;
                this.updateUploadStatus(`开始上传文件夹 "${this.folderName}"，共 ${this.totalFiles} 个文件...`, 'info');

                // 逐个上传文件
                this.uploadFilesSequentially();
            }

            // 顺序上传文件
            async uploadFilesSequentially() {
                for (let i = 0; i < this.files.length; i++) {
                    const file = this.files[i];
                    await this.uploadSingleFile(file);
                    this.uploadedFiles++;
                    this.uploadedSize += file.size;
                    
                    // 更新上传状态
                    const progress = Math.round((this.uploadedFiles / this.totalFiles) * 100);
                    this.updateUploadStatus(
                        `正在上传: ${this.uploadedFiles}/${this.totalFiles} (${progress}%) - ${file.name}`,
                        'info'
                    );
                }

                this.finishUpload();
            }

            // 上传单个文件
            uploadSingleFile(file) {
                return new Promise((resolve, reject) => {
                    const formData = new FormData();
                    formData.append('files', file);
                    // 添加相对路径信息
                    formData.append('relativePath', file.webkitRelativePath || file.name);

                    const xhr = new XMLHttpRequest();

                    xhr.addEventListener('load', () => {
                        if (xhr.status === 200) {
                            resolve();
                        } else {
                            reject(new Error(`上传失败: ${xhr.statusText}`));
                        }
                    });

                    xhr.addEventListener('error', () => {
                        reject(new Error('网络错误'));
                    });

                    xhr.open('POST', '/upload-folder');
                    xhr.send(formData);
                });
            }

            // 完成上传
            finishUpload() {
                document.getElementById('uploadBtn').disabled = false;
                
                if (this.uploadedFiles === this.totalFiles) {
                    this.updateUploadStatus(
                        `文件夹上传完成！共上传 ${this.uploadedFiles} 个文件，总大小: ${this.formatFileSize(this.uploadedSize)}`,
                        'success'
                    );
                    
                    // 清空选择
                    document.getElementById('folderInput').value = '';
                    document.getElementById('selectedFolderInfo').style.display = 'none';
                    document.getElementById('uploadBtn').disabled = true;
                    
                    // 3秒后清空状态
                    setTimeout(() => {
                        this.updateUploadStatus('', 'info');
                    }, 3000);
                } else {
                    this.updateUploadStatus(
                        `上传完成，共成功上传 ${this.uploadedFiles}/${this.totalFiles} 个文件`,
                        'warning'
                    );
                }
            }
        }

        // 初始化上传管理器
        const folderUploadManager = new FolderUploadManager();

        // 文件夹选择事件
        document.getElementById('folderInputContainer').addEventListener('click', function() {
            document.getElementById('folderInput').click();
        });

        document.getElementById('folderInput').addEventListener('change', function(e) {
            const files = e.target.files;
            console.log(files)
            if (files.length === 0) {
                document.getElementById('message').textContent = '请选择要上传的文件夹';
                return;
            }

            // 检查文件大小限制
            for (let file of files) {
                if (file.size > 1024 * 1024 * 1024) { // 1GB
                    document.getElementById('message').textContent = `文件 "${file.name}" 超过1GB大小限制`;
                    return;
                }
            }

            document.getElementById('message').textContent = '';
            folderUploadManager.analyzeFolder(files);
        });

        // 拖拽功能
        const folderInputContainer = document.getElementById('folderInputContainer');
        
        folderInputContainer.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('dragover');
        });

        folderInputContainer.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
        });

        folderInputContainer.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length === 0) return;
            
            // 模拟文件输入变化
            const dataTransfer = new DataTransfer();
            for (let file of files) {
                dataTransfer.items.add(file);
            }
            document.getElementById('folderInput').files = dataTransfer.files;
            
            // 触发change事件
            const event = new Event('change', { bubbles: true });
            document.getElementById('folderInput').dispatchEvent(event);
        });

        // 表单提交事件
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            folderUploadManager.startUpload();
        });
    </script>
</body>
</html>
